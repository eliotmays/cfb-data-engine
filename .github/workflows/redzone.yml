name: Update CFB Red Zone Data

on:
  schedule:
    - cron: '0 10 * * 0,2'  # Every Sunday & Tuesday at 10:00 AM UTC
  workflow_dispatch:        # Enables manual 'Run workflow' button in GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Extraction Script
        run: |
          python extract_redzone.py

      - name: Commit and Push Data Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/redzone_weekly.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated weekly red zone data update" && git push)
